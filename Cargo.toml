[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "载波断点台：GNSS 周跳候选、多频组合与弧段修订史（本地优先）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
