[package]
name = "carrier-breakpoint-station"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 载波相位周跳候选审阅与弧段修订史系统"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
