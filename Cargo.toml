[package]
name = "carrier-breakpoint-station"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip review station (载波断点台)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
