[package]
name = "cbpt"
version = "0.1.0"
edition = "2021"
description = "载波断点台 Carrier Breakpoint Station - local-first GNSS cycle-slip review"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
