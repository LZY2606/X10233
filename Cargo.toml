[package]
name = "carrier-break-station"
version = "1.0.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review station"

[lib]
name = "cbs"
path = "src/lib.rs"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[dev-dependencies]
tempfile = "3"
