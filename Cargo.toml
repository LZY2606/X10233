[package]
name = "carrier_break"
version = "0.1.0"
edition = "2021"
description = "本地优先的 GNSS 载波相位周跳候选审阅与弧段修订史系统"

[lib]
name = "carrier_break"
path = "src/lib.rs"

[[bin]]
name = "carrier_break"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"

[profile.dev]
opt-level = 1
