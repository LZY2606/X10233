[package]
name = "carrier-breakpoint-desk"
version = "0.1.0"
edition = "2021"
description = "载波断点台: local-first GNSS carrier-phase cycle-slip review desk"

[lib]
name = "carrier_breakpoint_desk"
path = "src/lib.rs"

[[bin]]
name = "carrier-breakpoint-desk"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
