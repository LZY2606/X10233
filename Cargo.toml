[package]
name = "carrier_break_station"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 载波相位周跳候选审阅系统"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rust-embed = "8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "carrier_break_station"
path = "src/main.rs"

[profile.release]
panic = "abort"
