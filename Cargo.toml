[package]
name = "cycle-slip-bench"
version = "0.1.0"
edition = "2021"
description = "载波断点台: local-first GNSS carrier-phase cycle-slip review workbench"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
