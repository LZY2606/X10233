[package]
name = "carrier_breakpoint"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review bench (offline case: carrier breakpoint)"

[lib]
name = "carrier_breakpoint"
path = "src/lib.rs"

[[bin]]
name = "carrier_breakpoint"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tower = "=0.5.3"
sha2 = "=0.10.9"
rand = "=0.8.8"
rand_chacha = "=0.3.1"
include_dir = "=0.7.4"

[dev-dependencies]
tempfile = "=3.27.0"
