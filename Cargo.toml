[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "本地优先的 GNSS 载波相位周跳候选审阅台：RINEX 导入、多检测器候选、弧段修订史与人工分叉裁定"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
parking_lot = "0.12"
anyhow = "1"
include_dir = "0.7"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[profile.test]
opt-level = 1
