[package]
name = "carrier-breakpoint-desk"
version = "0.1.0"
edition = "2021"
description = "载波断点台：GNSS 周跳候选、多频组合与弧段修订史（本地优先）"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
