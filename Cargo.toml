[package]
name = "gsb-cycle-slip"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 载波相位/周跳候选审阅台（Rust + Axum + SQLite + Web UI）"
license = "MIT"

[[bin]]
name = "gsb-cycle-slip"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
