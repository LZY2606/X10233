[package]
name = "gnslip"
version = "1.0.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review and arc revision ledger"

[lib]
name = "gnslip"
path = "src/lib.rs"

[[bin]]
name = "gnslip"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macr
os", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"

[dev-dependencies]
