[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "载波断点台: GNSS 周跳候选、多频组合与弧段修订史 (本地优先)"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 0
