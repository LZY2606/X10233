[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate and arc audit station"

[lib]
name = "carrier_break_station"
path = "src/lib.rs"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = "0.7.5"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "net", "sync"] }

[profile.dev]
opt-level = 0
