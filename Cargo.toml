[package]
name = "carrier-break-desk"
version = "0.1.0"
edition = "2021"
description = "载波断点台: GNSS 周跳候选、多频组合与弧段修订史 (local-first)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "cbd"
path = "src/lib.rs"

[[bin]]
name = "carrier-break-desk"
path = "src/main.rs"
