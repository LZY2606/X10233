[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "Carrier Break Station: local-first GNSS cycle-slip candidate review"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 0
