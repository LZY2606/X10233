[package]
name = "gnss-slip-review"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip review workbench"

[dependencies]
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
