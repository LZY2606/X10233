[package]
name = "carrier-break"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 载波相位周跳候选、多频组合与弧段修订史"

[lib]
name = "carrier_break"
path = "src/lib.rs"

[[bin]]
name = "carrier-break"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
