[package]
name = "carrier-break-station"
version = "1.0.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review station"

[lib]
name = "cbs"
path = "src/lib.rs"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower = "0.5"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.dev]
opt-level = 0
