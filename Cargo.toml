[package]
name = "carrier-break"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS cycle-slip candidate review workstation"

[lib]
name = "carrier_break"
path = "src/lib.rs"

[[bin]]
name = "carrier-break"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
