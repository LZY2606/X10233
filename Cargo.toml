[package]
name = "carrier_break_desk"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review desk"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower = "0.5"
