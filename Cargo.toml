[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 周跳候选、多频组合与弧段修订史"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[lib]
name = "carrier_break_station"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0
