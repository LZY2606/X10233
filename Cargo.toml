[package]
name = "carrier-breakstation"
version = "0.1.0"
edition = "2021"
description = "载波断点台：本地优先的 GNSS 载波相位周跳候选审阅与弧段修订史"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
