[package]
name = "carrier_break_station"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review and arc revision ledger"

[[bin]]
name = "carrier_break_station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
once_cell = "1"

[profile.dev]
opt-level = 0
