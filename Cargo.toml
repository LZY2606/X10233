[package]
name = "cycle-slip-desk"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review desk"

[[bin]]
name = "cycle-slip-desk"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.5", features = ["fs", "set-header"] }

[dev-dependencies]
tempfile = "3"
