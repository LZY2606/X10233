[package]
name = "carrier-breakpoint-gnss"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip review workbench (event-sourced, SQLite, Axum)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"

[profile.release]
opt-level = 1
