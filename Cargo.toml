[package]
name = "carrier-break-station"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review and arc revision history"

[lib]
name = "carrier_break_station"
path = "src/lib.rs"

[[bin]]
name = "carrier-break-station"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.31.0", features = ["bundled"] }
sha2 = "0.10.9"
hex = "0.4.3"
anyhow = "1.0.104"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
