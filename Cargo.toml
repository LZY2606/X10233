[package]
name = "cycleslip-arc"
version = "0.1.0"
edition = "2021"
description = "本地优先的 GNSS 载波相位周跳候选审阅与弧段修订系统"

[[bin]]
name = "cycleslip-arc"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["fs"] }
chrono = "0.4"
