[package]
name = "cycle-slip-bench"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review workbench"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0

[[bin]]
name = "cycle-slip-bench"
path = "src/main.rs"
