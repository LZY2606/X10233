[package]
name = "carrier-break-bench"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review (arc revision history)"

[[bin]]
name = "carrier-break-bench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
thiserror = "2"
include_dir = "0.7"

[profile.release]
panic = "unwind"
