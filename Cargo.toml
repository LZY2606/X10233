[package]
name = "cyclebreak"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review workbench"

[[bin]]
name = "cyclebreak"
path = "src/main.rs"

[lib]
name = "cyclebreak"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
