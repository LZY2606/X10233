[package]
name = "carrier-breakpoint-station"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip review workbench"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
