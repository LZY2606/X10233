[package]
name = "carrier-breakdesk"
version = "0.1.0"
edition = "2021"
description = "载波断点台: local-first GNSS carrier-phase cycle-slip review desk"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
