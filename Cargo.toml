[package]
name = "cycle-slip-bench"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review bench"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cycle-slip-bench"
path = "src/main.rs"

[profile.dev]
opt-level = 0
