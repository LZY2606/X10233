[package]
name = "gnss-cycle-slip"
version = "0.1.0"
edition = "2021"
description = "本地优先的 GNSS 载波相位周跳候选评审台（载波断点台）"

[[bin]]
name = "carrier-break"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
