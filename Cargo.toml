[package]
name = "carrierbreak"
version = "0.1.0"
edition = "2021"
description = "Local-first GNSS carrier-phase cycle-slip candidate review workbench"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "carrierbreak"
path = "src/main.rs"

[profile.dev]
opt-level = 0
