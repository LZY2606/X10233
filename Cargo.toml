[package]
name = "carrier_bench"
version = "0.1.0"
edition = "2021"
description = "本地优先的 GNSS 载波相位周跳候选审阅与弧段修订史系统"

[lib]
name = "carrier_bench"
path = "src/lib.rs"

[[bin]]
name = "carrier_bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
